name: Cloud marketing agents

on:
  schedule:
    - cron: "0 8 * * 1"
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Agent to run
        required: true
        default: execution
        type: choice
        options:
          - execution
          - strategy
      quality:
        description: Cost and quality tier
        required: true
        default: efficient
        type: choice
        options:
          - efficient
          - important

concurrency:
  group: cloud-marketing-agent
  cancel-in-progress: false

jobs:
  marketing:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
      pull-requests: write

    env:
      BOT_BRANCH: codex/cloud-marketing-agent
      # Prefer a PAT so the bot can open PRs. The default GITHUB_TOKEN cannot
      # create PRs until the repo setting "Allow GitHub Actions to create and
      # approve pull requests" is enabled.
      GH_TOKEN: ${{ secrets.MARKETING_BOT_TOKEN || github.token }}

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Select agent mode and check configuration
        id: setup
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_MODE: ${{ inputs.mode }}
          MANUAL_QUALITY: ${{ inputs.quality }}
          CODEX_KEY: ${{ secrets.OPENAI_API_KEY }}
          HAS_BOT_TOKEN: ${{ secrets.MARKETING_BOT_TOKEN != '' }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            mode="$MANUAL_MODE"
          elif [ "$EVENT_SCHEDULE" = "0 8 * * 1" ]; then
            mode="strategy"
          else
            mode="execution"
          fi

          if [ "$mode" = "strategy" ]; then
            prompt_file=".github/codex/prompts/marketing-strategy.md"
          else
            prompt_file=".github/codex/prompts/marketing-execution.md"
          fi

          # Scheduled work always uses the cost-efficient policy. The frontier
          # model is available only through an explicit manual "important" run.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$MANUAL_QUALITY" = "important" ]; then
            model="gpt-5.6-sol"
            effort="medium"
          elif [ "$mode" = "strategy" ]; then
            model="gpt-5.6-luna"
            effort="low"
          else
            model="gpt-5.6-terra"
            effort="low"
          fi

          if [ -n "$CODEX_KEY" ]; then
            configured="true"
          else
            configured="false"
            echo "OPENAI_API_KEY is not configured; cloud agent skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "prompt_file=$prompt_file" >> "$GITHUB_OUTPUT"
          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "effort=$effort" >> "$GITHUB_OUTPUT"
          echo "configured=$configured" >> "$GITHUB_OUTPUT"
          echo "Agent mode: $mode; model: $model; reasoning effort: $effort." >> "$GITHUB_STEP_SUMMARY"
          if [ "$HAS_BOT_TOKEN" != "true" ]; then
            echo "PR creation uses GITHUB_TOKEN. If GitHub Actions is not allowed to create pull requests, the job will push \`$BOT_BRANCH\` and stay green." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prepare persistent automation branch
        id: branch
        if: steps.setup.outputs.configured == 'true'
        run: |
          git fetch origin main
          open_pr="$(gh pr list --head "$BOT_BRANCH" --base main --state open --json url --jq '.[0].url')"
          if [ -n "$open_pr" ]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "Waiting for approval on $open_pr" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # If Actions cannot open PRs, unmerged work still lives on the bot
          # branch. Treat that as a pending review so we do not spend credits
          # every day rewriting the same branch.
          if git ls-remote --exit-code --heads origin "$BOT_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BOT_BRANCH"
            if ! git diff --quiet origin/main "origin/$BOT_BRANCH"; then
              echo "blocked=true" >> "$GITHUB_OUTPUT"
              echo "Unmerged marketing work is already on \`$BOT_BRANCH\`. Open a PR from that branch, or enable Settings → Actions → General → Workflow permissions → Allow GitHub Actions to create and approve pull requests, or add a \`MARKETING_BOT_TOKEN\` repo secret (classic/fine-grained PAT with contents + pull requests)." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git switch -C "$BOT_BRANCH" origin/main
          else
            git switch -c "$BOT_BRANCH"
          fi

          echo "blocked=false" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.setup.outputs.configured == 'true' && steps.branch.outputs.blocked == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        if: steps.setup.outputs.configured == 'true' && steps.branch.outputs.blocked == 'false'
        run: npm ci --no-audit --no-fund

      - name: Install pinned marketing skills
        if: steps.setup.outputs.configured == 'true' && steps.branch.outputs.blocked == 'false'
        env:
          CODEX_HOME_DIR: ${{ runner.temp }}/codex-home
          MARKETING_SKILLS_SHA: becd60ee9df07f7d595c26e092253ba49f7a9ffc
          OPEN_SEO_SHA: c469a48ae90ab58413b198fe3d1ac1aa90a9b070
        run: |
          skill_source="$(mktemp -d)"
          mkdir -p "$CODEX_HOME_DIR/skills"

          git clone --quiet https://github.com/coreyhaines31/marketingskills.git "$skill_source/marketing"
          git -C "$skill_source/marketing" checkout --quiet "$MARKETING_SKILLS_SHA"
          for skill in marketing-loops product-marketing analytics attribution content-strategy cro copywriting customer-research emails free-tools offers programmatic-seo referrals schema social; do
            cp -R "$skill_source/marketing/skills/$skill" "$CODEX_HOME_DIR/skills/$skill"
          done

          git clone --quiet https://github.com/every-app/open-seo.git "$skill_source/open-seo"
          git -C "$skill_source/open-seo" checkout --quiet "$OPEN_SEO_SHA"
          for skill in competitive-landscape competitor-analysis keyword-clustering keyword-research link-prospecting seo-audit seo-project-setup; do
            cp -R "$skill_source/open-seo/.agents/skills/$skill" "$CODEX_HOME_DIR/skills/$skill"
          done

      - name: Run cloud marketing agent
        if: steps.setup.outputs.configured == 'true' && steps.branch.outputs.blocked == 'false'
        id: codex
        timeout-minutes: 30
        continue-on-error: true
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-home: ${{ runner.temp }}/codex-home
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          prompt-file: ${{ steps.setup.outputs.prompt_file }}
          model: ${{ steps.setup.outputs.model }}
          effort: ${{ steps.setup.outputs.effort }}

      - name: Note agent failure without failing the job
        if: steps.setup.outputs.configured == 'true' && steps.branch.outputs.blocked == 'false' && steps.codex.outcome == 'failure'
        run: |
          echo "Cloud marketing agent did not finish (common causes: OpenAI credits, model outage, or sandbox limits). The scheduled job stays green so it does not email on a skipped day." >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce marketing guardrails
        id: guardrails
        if: steps.setup.outputs.configured == 'true' && steps.branch.outputs.blocked == 'false'
        env:
          MODE: ${{ steps.setup.outputs.mode }}
        run: |
          revert_path() {
            local path="$1"
            if git ls-files --error-unmatch -- "$path" >/dev/null 2>&1; then
              git checkout -- "$path"
            else
              rm -rf -- "$path"
            fi
          }

          mapfile -t changed < <(git ls-files --modified --deleted --others --exclude-standard)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "approval_required=true" >> "$GITHUB_OUTPUT"
            echo "No changes proposed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          discarded=0
          for path in "${changed[@]}"; do
            drop=""
            case "$path" in
              .github/*|package.json|package-lock.json|next.config.*|middleware.*|.env*|supabase/*|src/app/api/*)
                drop="Forbidden path changed: $path"
                ;;
            esac

            if [ -z "$drop" ] && [ "$MODE" = "strategy" ]; then
              case "$path" in
                .agents/*|docs/marketing/*) ;;
                *) drop="Strategy mode cannot change: $path" ;;
              esac
            elif [ -z "$drop" ]; then
              case "$path" in
                .agents/*|docs/marketing/*|src/app/*|src/components/*|src/lib/*|content/episodes/*|public/*) ;;
                *) drop="Execution mode cannot change: $path" ;;
              esac
              case "$path" in
                *stripe*|*checkout*|*supabase*|*auth*|*entitlement*)
                  drop="Sensitive product surface changed: $path"
                  ;;
              esac
            fi

            if [ -n "$drop" ]; then
              echo "$drop (reverted; job stays green)." | tee -a "$GITHUB_STEP_SUMMARY" >&2
              revert_path "$path"
              discarded=$((discarded + 1))
            fi
          done

          mapfile -t changed < <(git ls-files --modified --deleted --others --exclude-standard)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "approval_required=true" >> "$GITHUB_OUTPUT"
            if [ "$discarded" -gt 0 ]; then
              echo "All proposed files were outside the allowed surface and were discarded." >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi

          approval_required="true"
          if jq -e '.approval_required == false' .agents/run-decision.json >/dev/null 2>&1; then
            approval_required="false"
          fi
          if [ "${#changed[@]}" -gt 15 ]; then
            approval_required="true"
            echo "More than 15 changed files: approval required." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "approval_required=$approval_required" >> "$GITHUB_OUTPUT"

      - name: Validate proposal
        if: steps.setup.outputs.configured == 'true' && steps.branch.outputs.blocked == 'false'
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            exit 0
          fi
          if npm run lint && npm run build; then
            exit 0
          fi
          echo "Lint or build failed; discarding the proposal so the scheduled job stays green." >> "$GITHUB_STEP_SUMMARY"
          git reset --hard HEAD
          git clean -fd

      - name: Commit and update pull request
        if: steps.setup.outputs.configured == 'true' && steps.branch.outputs.blocked == 'false'
        env:
          MODE: ${{ steps.setup.outputs.mode }}
          APPROVAL_REQUIRED: ${{ steps.guardrails.outputs.approval_required }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            exit 0
          fi

          gh auth setup-git
          git config core.hooksPath /dev/null
          git config user.name "codex-cloud-marketing[bot]"
          git config user.email "codex-cloud-marketing[bot]@users.noreply.github.com"
          git add -A
          git commit -m "marketing: run cloud $MODE agent"
          git push --force-with-lease origin "HEAD:$BOT_BRANCH"
          echo "Pushed marketing proposal to \`$BOT_BRANCH\`." >> "$GITHUB_STEP_SUMMARY"

          existing_pr="$(gh pr list --head "$BOT_BRANCH" --base main --state open --json url --jq '.[0].url' || true)"
          if [ -z "$existing_pr" ]; then
            if existing_pr="$(gh pr create \
              --base main \
              --head "$BOT_BRANCH" \
              --title "marketing: cloud agent proposals" \
              --body "Automated cloud work toward a low-maintenance revenue stream. The agent may prepare substantial, coherent improvements, while consequential external actions, spend and sensitive product areas require explicit approval. Lint and build must pass. See .agents/marketing-operating-system.md and .agents/approval-queue.md.")"; then
              echo "Opened $existing_pr" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Could not open a pull request (GitHub Actions is not permitted to create PRs with the default token). Branch \`$BOT_BRANCH\` is ready: open a PR from it in the GitHub UI, or enable Settings → Actions → General → Workflow permissions → Allow GitHub Actions to create and approve pull requests, or add a \`MARKETING_BOT_TOKEN\` repo secret." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          if [ "$APPROVAL_REQUIRED" = "false" ]; then
            if gh pr merge "$existing_pr" --squash --delete-branch; then
              echo "Validated Level A change merged automatically: $existing_pr" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Could not auto-merge $existing_pr; left open for review." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            gh label create "approval-required" --color "B60205" --description "Requires owner approval before merge" 2>/dev/null || true
            gh pr edit "$existing_pr" --add-label "approval-required" || true
            echo "Approval required: $existing_pr" >> "$GITHUB_STEP_SUMMARY"
          fi
